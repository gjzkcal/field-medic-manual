# ゲームの画面に出る表示名の用語集。原稿・クイック表・フローの表記が画面とずれていないかを、pnpm test で確かめるのに使う。
# アプリには同梱しない（画面にも検索にも出ない）。
#
# 書き方（形は下の JSON Schema と pnpm test で確かめる）:
# - en は英語で遊んでいるときの表示。stringId はその文字列表のキー（文字列表を使わず prefab に名前を直に書いている物は省く）。
# - ja は、日本語で遊んでいるときに日本語で出るものにだけ書く（本体・Core・Circulation）。
#   ja を書いた用語は、原稿などに en が残っているとテストが失敗する。
# - manual は、日本語で遊んでいても英語で出るもの（Breathing）を、原稿で何と呼ぶか。ja と一緒には書かない。
# - 本体の表示名は、物品と操作の短い名前だけを載せる（本体の文字列表は写さない）。
# - 値は ACE Medical の Dev 版（ACE-Anvil の v1.5.0-dev41）とゲーム本体 1.9.0.37 の文字列表と prefab。
# 次の行は用語集の形式（JSON Schema）。VS Code で開くと、キーの補完と書き間違いの表示が効く
$schema: ./glossary.v1.schema.json
modChannel: dev
verifiedAt: "2026-11-08"
terms:
  # ---- 本体 ----
  - { id: tourniquet, mod: reforger, kind: item, stringId: AR-Item_Tourniquet_Name, en: Tourniquet, ja: 止血帯を使う }
