# 心停止（脈がない）ときの流れ。TCCC では CPR は MARCH PAWS の外の項目で、ここでは C で脈がないと分かったときに呼ばれる。単独でも実行できる。
# 各ノードの説明は ACE Medical Dev 1.5.36 の仕様（ソースと実機で確かめた事実）に基づく。
# 処置の順番は作者の方針（King LT → 酸素マスク → Epinephrine → CPR。出血は止血してから、生理食塩水は合間に。Epinephrine は約 3 分ごとに 1 本）。
# 呼んだ側で A と R（気胸）を済ませてある前提。単独で開いたときのために、気胸の確かめ方へのリンクを置く。
# 心停止と CPR は Circulation の仕組み。気道閉塞・酸素マスクは Breathing の仕組み。
# 次の行はフローの形式（JSON Schema）。VS Code で開くと、キーの補完と書き間違いの表示が効く
$schema: ./triage-flow.v1.schema.json
id: cardiac-arrest
title: 心停止
description: 脈がない負傷者に、King LT・酸素マスク・Epinephrine を使い、CPR を続ける（Circulation）
modTarget: [circulation, breathing]
modChannel: dev
verifiedAt: "2026-11-04"
version: 1
order: 70
march: [cpr]
start: b-circulation
nodes:
  b-circulation:
    type: branch
    cases:
      - { mods: [circulation, breathing], next: a-airway }
      - { mods: [circulation], next: a-epi }
    else: end-no-circulation

  a-airway:
    type: action
    text: 仰向けのまま、King LT で気道を確保する
    help: >-
      CPR は仰向けでないとできない（横向きなら腰の「仰向けに寝かせる」、1 秒）。
      King LT（頭の「Insert King LT」）は、入れた時点で舌根沈下と嘔吐の両方を解除し、以後どちらも起きない。
      気道が塞がったままでは SpO2 が 65% を超えず、CPR で蘇生しない。
      緊張性気胸があると酸素マスクが効かないので、気胸を確かめていなければ先に確かめる
    items: [King LT]
    ifMissing: { next: a-airway-no-kinglt }
    links:
      - doc:king-lt.md
      - doc:cardiac-arrest.md#breathing-を入れているとき
      - flow:pneumothorax
    next: a-oxygen

  a-airway-no-kinglt:
    type: action
    text: 嘔吐物の除去とあご先挙上で気道を開ける
    help: >-
      頭に「Clear vomit」が出ていれば嘔吐物を除去する（1 秒）。続けてあご先挙上（Lift chin、1 秒）で舌根沈下を解除する。
      仰向けに戻すたびに 15% で舌根沈下し直す。King LT は初期装備に無く、補給で手に入れる
    links:
      - doc:airway.md#嘔吐物の除去
      - doc:airway.md#あご先挙上
    next: a-oxygen

  a-oxygen:
    type: action
    text: 酸素マスクを付ける
    help: >-
      頭の「Put oxygen mask on」（3.3 秒）。気道が開いている間、心停止中・CPR 中にも最低限の換気を保つ。
      付けていると CPR 中の SpO2 が 82% で安定する（付けていないと約 74〜80% を頂点にゆっくり下がる）。SpO2 が 65% 未満の間は蘇生の判定が必ず失敗する。
      消費せず口元に残る。気道が塞がっているときと緊張性気胸のときは効かない。初期装備には無く、補給で手に入れる
    items: [酸素マスク（Oxygen Mask）]
    ifMissing: { next: a-epi }
    links:
      - doc:oxygen-mask.md
    next: a-epi

  a-epi:
    type: action
    text: Epinephrine を 1 本打つ
    help: >-
      蘇生の判定の頻度を上げる（打って約 23 秒で最大 1.43 倍、約 164 秒で体内から消える）。1 回の成功率は変えない。
      このあと蘇生しないまま約 3 分たったら、もう 1 本打つ。同時に 2 本以上は打たない（一度に約 4.4 本、激痛なら約 2.4 本で心停止に当たる過量になる）
    items: [Epinephrine]
    ifMissing: { next: a-cpr }
    links:
      - doc:cardiac-arrest.md#エピネフリンの役割
      - doc:drug-effects.md#過量投与
    next: a-cpr

  a-cpr:
    type: action
    text: CPR を行う（Perform CPR）
    help: >-
      胸に対して行う。CPR をした時間 22 秒ごとに蘇生の判定があり、成功率は血液量で決まる（70% 以上で 40%、20% 以下で 0%）。
      CPR 中は脳が損傷しない（CPR なしの心停止は、10 秒の後に脳が減り始め、約 5 分で死亡する）。蘇生しても CPR は自動では止まらないので、脈を確かめる。
      生理食塩水は CPR の合間に付ける（付ければ 90 秒かけて自動で入る）。タイマーは判定の間隔（22 秒）
    timerSec: 22
    links:
      - doc:cardiac-arrest.md#cpr-を行う
      - doc:cardiac-arrest.md#脳の損傷と残り時間
      - doc:cardiac-arrest-system.md#蘇生の判定
      - doc:tccc-march.md#cpr-の扱い
    next: q-rosc

  q-rosc:
    type: question
    text: 脈が戻った？
    help: 蘇生した直後は状態が Critical で、意識は戻らない。血液が十分なら約 2 秒で Stable になる
    choices:
      - { label: 戻った, tone: yes, next: end-rosc }
      - { label: 戻らない, tone: danger, next: a-cpr }
      - { label: 戻らない・失血が Class II 以上, tone: danger, next: a-saline-cpr }
      - { label: 戻らないまま約 3 分たった, tone: danger, next: a-epi }

  a-saline-cpr:
    type: action
    text: 生理食塩水を付けて、CPR を続ける
    help: 血液が戻るほど蘇生の成功率が上がる（血液 20〜70% の間は直線で 0〜40%）。1 袋で血液の 25% が 90 秒かけて入る
    items: [生理食塩水]
    ifMissing: { next: a-cpr }
    links:
      - doc:cardiac-arrest-system.md#蘇生までの時間
    next: a-cpr

  end-rosc:
    type: end
    outcome: warn
    text: 脈が戻った。CPR をやめる
    help: 蘇生した直後は状態が Critical で、意識は戻らない。続けて、脈があるときの手当て（回復体位・失血の確認）に進む
    links:
      - doc:cardiac-arrest.md#蘇生した後

  end-no-circulation:
    type: end
    outcome: ok
    text: Circulation を入れていないので、心停止は起きない
