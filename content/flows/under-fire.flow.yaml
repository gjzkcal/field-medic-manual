# TCCC の CUF/T（Care Under Fire/Threat）に当たる。「負傷者を見つけたら」から、周囲が安全でないときに呼ばれる。単独でも実行できる。
# 各ノードの説明は ACE Medical の Dev 版（ACE-Anvil の v1.5.0-dev41、ゲーム本体 1.9.0.37）の仕様（ソースと実機で確かめた事実）に基づく。
# 処置の選び方は作者の方針（手足の出血は止血帯、あとは遮蔽へ運ぶ）。
# フェニレフリンは使わない（激痛の患者は約 1 本で心停止しうるため。マニュアルの「薬の効き方」の過量投与）。
# 次の行はフローの形式（JSON Schema）。VS Code で開くと、キーの補完と書き間違いの表示が効く
$schema: ./triage-flow.v1.schema.json
id: under-fire
title: 撃たれている中の負傷者
description: TCCC の CUF/T。腕・脚の出血に止血帯を巻き、遮蔽物の陰へ運ぶ
modTarget: [core]
modChannel: dev
verifiedAt: "2026-11-08"
version: 1
order: 20
march: [cuf]
start: q-limb
nodes:
  q-limb:
    type: question
    text: 止血帯を巻いていない腕・脚から出血している？
    help: >-
      傷のある部位からは血が噴く。診察（医療ラジアルメニューの「診察する」）には出血と止血帯が出る。
      止血帯は腕・脚にだけ巻ける。頭・首・胸・腹・腰の出血は、遮蔽物の陰に入ってから包帯で止める
    choices:
      - { label: はい, tone: danger, next: a-tourniquet }
      - { label: いいえ（胴・頭だけ、または出血なし）, tone: no, next: a-move-cover }

  a-tourniquet:
    type: action
    text: 止血帯を巻く
    help: >-
      ゲーム内の表示は「止血帯を使う」。衛生兵なら他人に 3.4〜4.4 秒で、包帯（5.9〜6.4 秒）より速い。
      巻いた腕・脚の傷の出血を 0.001 倍にし、出血はほぼ止まる。
      出血の扱いは残るので、包帯を巻くまで血液は回復しない（安全になってから包帯を巻く）
    items: [止血帯]
    ifMissing: { next: a-move-cover }
    links:
      - doc:tourniquet.md
      - doc:tourniquet.md#所要時間
      - doc:tccc-march.md#tccc-の-3-つの段階
    next: q-limb

  a-move-cover:
    type: action
    text: 負傷者を遮蔽物の陰へ運ぶ
    help: >-
      意識があって動けるなら、本人が遮蔽物の陰へ移る。
      運ぶときは、腰の「引きずって運ぶ（Drag）」（1 秒、しゃがんで後ろ向きにだけ動ける）か、「持ちあげて運ぶ（Carry）」（3 秒、立ったまま）。
      移動は半分の速さになる。離すのは Ctrl+X。武器を選ぶと手を離す
    links:
      - doc:medical-actions.md#負傷者を運ぶ
      - doc:death-second-chance.md#倒れた後の追い打ち
    next: end-cover

  end-cover:
    type: end
    outcome: warn
    text: 遮蔽物の陰に入れた。周囲が安全かを確かめる
    help: 意識を失ってから 1 秒たった後に致命打を受けると、Second Chance の判定なしで即死する
    links:
      - doc:death-second-chance.md#倒れた後の追い打ち
