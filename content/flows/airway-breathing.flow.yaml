# MARCH の A と R をまとめて確かめる。「気道を開ける」（airway）と「気胸を確かめる」（pneumothorax）を順に呼ぶ。
# 「負傷者を見つけたら」から、意識がない負傷者の SpO2 が低いときに、もう一度確かめるために呼ばれる。単独でも実行できる。
# id はお気に入り・履歴・クイック表のリンクで使っているので変えない。
# Breathing を入れていなければ、設定の「使っている MOD」で branch がすぐ終わりへ進む。
# 次の行はフローの形式（JSON Schema）。VS Code で開くと、キーの補完と書き間違いの表示が効く
$schema: ./triage-flow.v1.schema.json
id: airway-breathing
title: 気道と呼吸を確かめる
description: MARCH の A と R。意識がない負傷者の気道を開け、気胸を確かめる（Breathing）
modTarget: [breathing]
modChannel: dev
verifiedAt: "2026-11-04"
version: 5
order: 40
start: b-breathing
nodes:
  b-breathing:
    type: branch
    cases:
      - { mods: [breathing], next: sf-airway }
    else: end-no-breathing

  sf-airway:
    type: subflow
    flowId: airway
    next: sf-pneumothorax

  sf-pneumothorax:
    type: subflow
    flowId: pneumothorax
    next: end-ok

  end-ok:
    type: end
    outcome: ok
    text: 気道と呼吸を確かめた
    help: 状態が変わったら、もう一度確かめる
    march: [a, r]
    links:
      - doc:tccc-march.md#march

  end-no-breathing:
    type: end
    outcome: ok
    text: Breathing を入れていないので、気道閉塞と気胸は起きない
