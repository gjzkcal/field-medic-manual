# 負傷者を見つけたときの流れ。TCCC の段階（CUF/T → TFC）と MARCH PAWS の順に、文字ごとのサブフローを呼ぶ。
# 各ノードの説明は ACE Medical Dev 1.5.36 の仕様（ソースと実機で確かめた事実）に基づく。
# 処置の順番は作者の方針（MARCH PAWS を ACE Medical に当てはめたもの）。ACE とぶつかるところは手直ししてある:
# - 撃たれている間は止血帯と移動だけにする（激痛の患者は、フェニレフリン約 1 本で心停止しうるため）
# - 意識がない負傷者は A（物品なし）→ R → C（脈）の順。King LT か回復体位かは脈を見てから選ぶ（CPR は仰向けでしかできないため）
# - 気道閉塞は意識がないときだけ起きるので、意識がある負傷者は A を飛ばして R から
# MOD の有無は利用者に尋ねず、設定の「使っている MOD」で branch ノードが自動に分岐する。
# 次の行はフローの形式（JSON Schema）。VS Code で開くと、キーの補完と書き間違いの表示が効く
$schema: ./triage-flow.v1.schema.json
id: casualty-first-contact
title: 負傷者を見つけたら
description: TCCC と MARCH PAWS の順に、止血 → 気道 → 呼吸 → 循環（脈）→ 痛み → 傷と骨折へ進む（設定の MOD に合わせて分岐する）
modTarget: [core, circulation, breathing]
modChannel: dev
verifiedAt: "2026-11-04"
version: 5
order: 10
start: q-safe
nodes:
  q-safe:
    type: question
    text: 周囲は安全？
    help: >-
      撃たれている間（TCCC の CUF/T）は、腕・脚の止血帯と遮蔽への移動だけをする。
      意識を失ってから 1 秒たった後に致命打を受けると、Second Chance の判定なしで即死する
    march: [cuf]
    choices:
      - { label: はい, tone: yes, next: sf-bleeding }
      - { label: いいえ（撃たれている）, tone: no, next: sf-under-fire }

  sf-under-fire:
    type: subflow
    flowId: under-fire
    next: q-safe

  sf-bleeding:
    type: subflow
    flowId: massive-bleeding
    next: q-conscious

  q-conscious:
    type: question
    text: 意識がある？
    help: >-
      Circulation を入れていれば、状態が Critical 以上になると強制的に意識を失う。
      Circulation なしでは、血液 33.3% 以下でも意識を失う。
      気道が塞がるのは意識がないときだけ
    choices:
      - { label: はい, tone: yes, next: b-chest-conscious }
      - { label: いいえ, tone: no, next: b-airway }

  # ---- 意識がある: A を飛ばして R → C → P → W・S ----
  # 気胸・気道閉塞は Breathing の仕組み。入れていなければ、サブフローの「起きない」の画面を出さずに飛ばす
  b-chest-conscious:
    type: branch
    cases:
      - { mods: [breathing], next: sf-chest-conscious }
    else: sf-circulation-conscious

  sf-chest-conscious:
    type: subflow
    flowId: pneumothorax
    next: sf-circulation-conscious

  sf-circulation-conscious:
    type: subflow
    flowId: circulation
    next: sf-pain

  # ---- 意識がない: A → R → C（脈） ----
  b-airway:
    type: branch
    cases:
      - { mods: [breathing], next: sf-airway }
    else: b-pulse

  sf-airway:
    type: subflow
    flowId: airway
    next: sf-chest-unconscious

  sf-chest-unconscious:
    type: subflow
    flowId: pneumothorax
    next: b-pulse

  # 脈と心停止は Circulation の仕組み。なければ脈を確かめずに進む
  b-pulse:
    type: branch
    cases:
      - { mods: [circulation], next: q-pulse }
    else: b-recovery

  q-pulse:
    type: question
    text: 脈がある？
    help: >-
      「Check pulse」（頭・胸・腕・脚。3 秒、意識不明の相手だけ）か、医療ラジアルメニューの診察で確かめる。
      心停止中は「You find a heart rate of 0」と出る。心停止した本人の画面はほぼ真っ黒になる。
      CPR をしない心停止は、10 秒の後に脳が減り始め、約 5 分で死亡する
    march: [c]
    choices:
      - { label: ある, tone: yes, next: b-recovery }
      - { label: ない（心停止）, tone: danger, next: sf-cardiac-arrest }

  sf-cardiac-arrest:
    type: subflow
    flowId: cardiac-arrest
    next: b-recovery

  # 回復体位が気道に効くのは Breathing を入れているときだけ
  b-recovery:
    type: branch
    cases:
      - { mods: [breathing], next: a-recovery }
    else: sf-circulation-unconscious

  a-recovery:
    type: action
    text: 回復体位にする
    help: >-
      腰の「左向きに寝かせる」か「右向きに寝かせる」（1 秒）。舌根沈下が解除され、以後の嘔吐も起きない。
      脈があると分かってから横向きにする（CPR は仰向けでしかできない）。
      注意: 既に嘔吐で塞がっている気道（頭に「Clear vomit」が出る）と、緊張性気胸は回復体位では解けない。次の SpO2 の確認で分かる
    march: [a]
    links:
      - doc:airway.md#回復体位
      - doc:medical-actions.md#体位を変える
    next: q-spo2

  q-spo2:
    type: question
    text: SpO2 と呼吸数は？
    help: >-
      医療ラジアルメニューの「診察する」から、Check respiratory rate と Check SpO2（照準の先の相手に、待ち時間なし）。
      正常値は呼吸数 14、SpO2 97。炭酸アンモニウムは状態が Stable のときだけ効き、SpO2 85% 未満では Stable にならない
    march: [r]
    choices:
      - { label: SpO2 が低い・呼吸数が 0 か速い, tone: danger, next: sf-airway-breathing }
      - { label: どちらでもない, tone: yes, next: sf-circulation-unconscious }

  sf-airway-breathing:
    type: subflow
    flowId: airway-breathing
    next: q-spo2

  sf-circulation-unconscious:
    type: subflow
    flowId: circulation
    next: b-wake

  # 炭酸アンモニウムは Circulation の物品。なければ Core のエピネフリンで起こす
  b-wake:
    type: branch
    cases:
      - { mods: [circulation], next: a-wake }
    else: a-epi-core

  a-wake:
    type: action
    text: 炭酸アンモニウム（Ammonium Carbonate）で起こす
    help: >-
      頭の「Hold under nose」で使う。Stable の患者にだけ効き、それ以外では何も起きないが物品は減る。
      蘇生していない患者なら、脳が 75% 以上で必ず成功し、約 3 秒で目覚める。蘇生した後の患者は、脳の状態で成功率が下がる
    items: [炭酸アンモニウム（Ammonium Carbonate）]
    ifMissing: { next: a-wake-no-ammonia }
    links:
      - doc:consciousness.md#炭酸アンモニウムで起こす
      - doc:states.md#状態の閾値
    next: sf-pain

  a-wake-no-ammonia:
    type: action
    text: 医療キットか仲間から炭酸アンモニウムを受け取る
    help: >-
      医療キットには炭酸アンモニウムが 8 個入っている（Circulation）。
      なければ、Stable なら意識は自然に戻る（蘇生していなければ約 60〜70 秒。蘇生した後は遅く、脳 83% で約 113 秒）
    links:
      - doc:consciousness.md#意識が戻る条件と時間
    next: sf-pain

  # ---- Circulation なし: Core のエピネフリンで起こす ----
  a-epi-core:
    type: action
    text: エピネフリンで意識の回復を早める（Circulation なし）
    help: >-
      使える条件: 意識不明、エピネフリンの効果がまだない、出血していない（止血帯だけで止めた傷も出血に数える）、全体の健康度 0.33 以上（Hitzones を入れていれば、この条件はない）。
      Second Chance の後でも、打ってから約 19 秒で目覚める。血液が 33.3% 以下なら目覚めない
    items: [エピネフリン]
    ifMissing: { next: a-wake-core-no-epi }
    links:
      - doc:consciousness.md#エピネフリンで起こす
    next: sf-pain

  a-wake-core-no-epi:
    type: action
    text: 医療キットか仲間からエピネフリンを受け取る（Circulation なし）
    help: >-
      医療キットにはエピネフリンが 8 本入っている。
      なければ、意識は最後の被弾から 10 秒後に回復し始め、0 からなら約 73 秒で目覚める。
      Second Chance の後は自然には回復しない（`m_fSecondChanceResilienceRegenScale` の既定 0 のとき）。血液が 33.3% 以下の間も回復しない
    links:
      - doc:consciousness.md#意識が戻る条件と時間
      - doc:death-second-chance.md#second-chance-とは
    next: sf-pain

  # ---- PAWS ----
  sf-pain:
    type: subflow
    flowId: pain
    next: sf-wounds

  sf-wounds:
    type: subflow
    flowId: wounds-fractures
    next: end-stable

  end-stable:
    type: end
    outcome: ok
    text: ひととおり確かめた。定期的に確かめ直す
    help: >-
      状態が変わったら、最初からやり直す。
      MARCH の H（低体温・頭部外傷）と PAWS の A（抗菌薬）に当たる処置は、ACE Medical に無い
    links:
      - doc:tccc-march.md#march
      - doc:tccc-march.md#paws
