# MARCH の R（Respiration、呼吸）に当たる。「負傷者を見つけたら」から、意識の有無にかかわらず呼ばれる。単独でも実行できる。
# 各ノードの説明は ACE Medical の Dev 版（ACE-Anvil の v1.5.0-dev41、ゲーム本体 1.9.0.37）の仕様（ソースと実機で確かめた事実）に基づく。
# 処置の選び方は作者の方針（緊張性は NCD キット、開放性はチェストシール。物品がなければ仲間から受け取る）。
# Breathing を入れていなければ、設定の「使っている MOD」で branch がすぐ終わりへ進む。
# 次の行はフローの形式（JSON Schema）。VS Code で開くと、キーの補完と書き間違いの表示が効く
$schema: ./triage-flow.v1.schema.json
id: pneumothorax
title: 気胸を確かめる
description: MARCH の R。診察で気胸を確かめ、NCD キットとチェストシールで処置する（Breathing）
modTarget: [breathing]
modChannel: dev
verifiedAt: "2026-11-08"
version: 1
order: 50
march: [r]
start: b-breathing
nodes:
  b-breathing:
    type: branch
    cases:
      - { mods: [breathing], next: q-chest }
    else: end-no-breathing

  q-chest:
    type: question
    text: 診察に気胸が出ている？
    help: >-
      医療ラジアルメニューの「診察する」で、「Tension pneumothorax」（緊張性）か「Open pneumothorax」（開放性）が出る。両方あるときは緊張性が出る。
      「診察する」は意識がある相手にも使える。気胸は意識があっても起きる。
      気胸は胸への銃弾・近接攻撃の強い打撃で起きる（爆発・落下では起きない）
    choices:
      - { label: Tension pneumothorax, tone: danger, next: a-ncd }
      - { label: Open pneumothorax, tone: danger, next: a-chest-seal }
      - { label: 出ていない, tone: no, next: end-ok }

  a-ncd:
    type: action
    text: 胸に NCD キットを使う（Perform needle decompression）
    help: >-
      緊張性気胸だけを解除する（6.3 秒）。開放性気胸は残るので、もう一度診察すると「Open pneumothorax」が出る。
      緊張性の間は血圧が下がり（平均 46〜69 mmHg）、約 60 秒ごとに必ず悪化して、3〜4 分で心停止する
    items: [NCD キット（NCD Kit）]
    ifMissing: { next: end-no-ncd }
    links:
      - doc:ncd-kit.md
      - doc:breathing.md#気胸の見分け方
      - doc:tccc-march.md#march
    next: q-chest

  end-no-ncd:
    type: end
    outcome: critical
    text: NCD キットを持っている仲間から受け取る
    help: >-
      チェストシールでは緊張性気胸は治らない。ただし、貼ると悪化は止まる（血圧は低いまま、Unstable）。NCD キットは医療キットにも初期装備にも無く、補給（アーセナル）で手に入れる。
      緊張性の間は約 60 秒ごとに必ず悪化し、3〜4 分で心停止する
    links:
      - doc:items.md#breathing-の物品の入手

  a-chest-seal:
    type: action
    text: 胸にチェストシールを貼る（Use chest seal）
    help: >-
      開放性気胸を 0 に戻して治す（緊張性は治さない）。気胸がないと使えない。自分に使うときは伏せではできない。
      放置すると約 60 秒ごとに悪化し（50% で +0.18、5% で緊張性に）、0.75 に達すると心停止する。蘇生しても 0.75 のまま残る
    items: [チェストシール（Chest Seal）]
    ifMissing: { next: end-no-chest-seal }
    links:
      - doc:chest-seal.md
      - doc:pneumothorax-system.md#気胸の悪化と放置したときの時間
    next: q-chest

  end-no-chest-seal:
    type: end
    outcome: warn
    text: チェストシールを持っている仲間から受け取る
    help: >-
      チェストシールは医療キットにも初期装備にも無く、補給（アーセナル）で手に入れる。
      開放性気胸だけなら状態は Stable のままのことが多い（SpO2 は 0.75 でも約 88%）。ただし放置すると悪化し、心停止までの中央値は約 6 分
    links:
      - doc:breathing.md#気胸の悪化と放置したときの時間

  end-ok:
    type: end
    outcome: ok
    text: 気胸は無い（処置した）
    help: 胸を撃たれたら、もう一度確かめる。開放性気胸は放置すると約 60 秒ごとに悪化しうる

  end-no-breathing:
    type: end
    outcome: ok
    text: Breathing を入れていないので、気胸は起きない
