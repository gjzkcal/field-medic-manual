name: 機能の要望
description: 新しい機能や、今の機能の改善の提案
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること・使う場面
      description: どんな場面で、何に困っているかを書いてください。
      placeholder: "プレイ中に○○を調べるとき、…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: ほしい機能
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代わりの案
      description: ほかに考えた方法や、今しのいでいるやり方があれば書いてください。
  - type: dropdown
    id: platform
    attributes:
      label: 対象の版
      options:
        - 両方
        - デスクトップ版
        - Web 版
