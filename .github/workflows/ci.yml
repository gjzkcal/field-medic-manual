# main への push と PR で、ローカルと同じ確認（lint・test・clippy・cargo test）を回す。
# リリース（release.yml）もこのワークフローを呼び出し、通ってからビルドする。
name: CI

on:
  # タグの push では単独で走らせない（release.yml から呼ばれて走るので二重になる）
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# 同じ PR や main に続けて push したら古い実行を止める。リリース（タグ）は確認を最後まで残す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# 付け替えられるタグではなくコミットの SHA で外部のアクションを固定し、版はコメントに書く
# （Renovate が release.yml とそろえて SHA とコメントを両方更新する。手で変えるときも同じようにする）
jobs:
  # 変更したファイルで、画面側と Rust 側のどちらを走らせるかを決める。
  # main では前回の push との差分しか見ないので、古い実行を止めた回の変更は確かめられずに残ることがある。
  # リリース（タグ）では差分を見ずに両方走らせて、取りこぼしを配らないようにする
  changes:
    # git と API で差分を見るだけで OS に依らないので、起動の速いランナーにする
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # PR の変更したファイルの一覧を API で取るため
      pull-requests: read
    outputs:
      frontend: ${{ github.ref_type == 'tag' || steps.filter.outputs.frontend == 'true' }}
      rust: ${{ github.ref_type == 'tag' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref_type != 'tag'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.ref_type != 'tag'
        with:
          predicate-quantifier: some-with-excludes
          # 画面側のテストは src-tauri の about.toml・tauri.conf.json・Cargo.toml・Cargo.lock を読み、
          # Prettier は src-tauri の JSON も確かめるので、画面側は「全部から Rust だけのファイルを除いたもの」にする
          filters: |
            frontend:
              - '**'
              - '!src-tauri/src/**'
              - '!src-tauri/build.rs'
              - '!src-tauri/icons/**'
              - '!src-tauri/.cargo/**'
              - '!src-tauri/rust-toolchain.toml'
            rust:
              - 'src-tauri/**'
              # バンドルの resources として tauri-build がビルドのときに読む
              - 'LICENSE'
              - 'THIRD_PARTY_LICENSES.txt'
              # 手で直した bindings も、Rust から作り直したものと一致するか確かめる
              - 'src/lib/bindings/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    # キャッシュが空のときのビルド（約 4 分）とキャッシュの保存に余裕を持たせる
    timeout-minutes: 20
    env:
      # 確認ではデバッガを使わないので、デバッグ情報を作らずにビルドとキャッシュを軽くする（test プロファイルも dev を継ぐ）
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml の版を入れる。rust-cache がキーに rustc の版を使うので、その前に入れる
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          # PR やタグで保存したキャッシュはほかの ref から使えず容量を食うだけなので、main でだけ保存する
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      # ts-rs は消した型のファイルを残すので、空にしてから作り直し、消し忘れも差分に出す
      - run: rm -rf ../src/lib/bindings
        shell: bash

      - run: cargo test

      # Rust の型を変えて bindings のコミットを忘れると、画面側が古い型のまま lint・test を通ってしまう。
      # git diff は未追跡のファイル（新しい型）を見ないので、追加・変更・削除をすべて index に載せてからコミットと比べる
      - name: Check that bindings are up to date
        shell: bash
        run: |
          git add -- ../src/lib/bindings
          git diff --cached --exit-code -- ../src/lib/bindings || {
            echo "::error::src/lib/bindings が Rust の型と一致しません。cd src-tauri && cargo test で作り直してコミットしてください"
            exit 1
          }
