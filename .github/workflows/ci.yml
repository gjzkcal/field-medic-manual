# main への push と PR で、ローカルと同じ確認（lint・test・clippy・cargo test）を回す。
# リリース（release.yml）もこのワークフローを呼び出し、通ってからビルドする。
name: CI

on:
  # タグの push では単独で走らせない（release.yml から呼ばれて走るので二重になる）
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# 同じ PR に続けて push したら古い実行を止める。main とリリースは確認を最後まで残す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    # リリースのジョブと同じく、付け替えられるタグではなくコミットの SHA で外部のアクションを
    # 固定し、版はコメントに書く（更新するときは release.yml とそろえて SHA とコメントを両方変える）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # 版をブランチ名で選ぶアクションなので、SHA で固定したら toolchain を明示する
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          # PR やタグで保存したキャッシュはほかの ref から使えず容量を食うだけなので、main でだけ保存する
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm test
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
