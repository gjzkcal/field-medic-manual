# マニュアルの Web 版を GitHub Pages（https://gjzkcal.github.io/field-medic-manual/）に公開する。
# 配ったアプリと同じ原稿にするため、リリース（release.yml）が Releases への公開に成功してから呼び出す。
# 手で公開し直すときは、Actions の画面で版のタグ（v0.4.0 など）を選んで実行する。
# 公開の後に、本番の全画面と重い原稿の Performance を Lighthouse で測って記録する（lighthouse ジョブ）。
name: Pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# 付け替えられるタグではなくコミットの SHA で外部のアクションを固定し、版はコメントに書く
# （Renovate が ci.yml・release.yml とそろえて SHA とコメントを両方更新する。手で変えるときも同じようにする）
jobs:
  build:
    # 画面のビルドは OS に依らないので、起動の速いランナーにする
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      library-sha256: ${{ steps.library.outputs.sha256 }}
    steps:
      # main など、配っていない原稿を公開しないよう、版のタグからだけ公開する
      - name: Check that a release tag is selected
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        run: |
          echo "::error::Web 版は版のタグ（v0.4.0 など）から公開してください（今は ${GITHUB_REF}）"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:web

      # ディープリンクを開けなくなる・HTTP 404 で返る・Tauri の API がブラウザに入って落ちる、という壊れ方を公開の前に止める
      - name: Check the build output
        run: |
          cmp dist-web/index.html dist-web/404.html
          # 画面ごと・原稿ごとの写しは、画面の名前を出す <title> の行だけが index.html と違う
          for page in dist-web/library.html dist-web/*.html dist-web/doc/*.html; do
            if ! diff <(sed '/<title>/d' dist-web/index.html) <(sed '/<title>/d' "$page") >/dev/null; then
              echo "::error::$page が index.html と <title> 以外でも違います"
              exit 1
            fi
          done
          # 原稿ごとの写しが無いと、本文の URL を直接開いたときに HTTP 404 で返る
          manuals=$(ls content/manuals/*.md | wc -l)
          pages=$(ls dist-web/doc/*.html | wc -l)
          if [ "$manuals" -ne "$pages" ]; then
            echo "::error::原稿は $manuals 本ですが、dist-web/doc の写しは $pages 個です"
            exit 1
          fi
          # フローも同じく、写しが無いと実行画面の URL を直接開いたときに HTTP 404 で返る
          flows=$(ls content/flows/*.flow.yaml | wc -l)
          flow_pages=$(ls dist-web/triage/*.html | wc -l)
          if [ "$flows" -ne "$flow_pages" ]; then
            echo "::error::フローは $flows 本ですが、dist-web/triage の写しは $flow_pages 個です"
            exit 1
          fi
          if grep -rl "__TAURI" dist-web; then
            echo "::error::Web 版のビルドに Tauri の API が入っています"
            exit 1
          fi
          # 原稿はビルドのときに変換して同梱する。無いと、ブラウザで原稿の表を読めない
          if ! ls dist-web/assets/_virtual_web-store-*.js >/dev/null 2>&1; then
            echo "::error::Web 版のビルドに、変換した原稿の表（virtual:web-store）がありません"
            exit 1
          fi

      # 公開の後に本番を測る lighthouse ジョブが、CDN が新しい版を返し始めたかを見分けるのに使う。
      # 写しは画面ごとに <title> が違うので、そのジョブが取る /library と同じ写しの値にする
      - name: Hash the library page
        id: library
        run: echo "sha256=$(sha256sum dist-web/library.html | cut -d " " -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # Pages への書き込みと、その認証に使う OIDC のトークンは、公開するこのジョブだけに与える
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # タグの push と手での実行が重なっても、公開の途中で止めない
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # 公開した Web 版の全画面と重い原稿の Performance を測って記録する（scripts/lighthouse.ts）。
  # 利用者が開くもの（この版と Pages の配信）の数字にするため、preview ではなく本番を測る。
  # 点数は計測のたびにぶれるので合否にはしない。表はジョブの概要に、レポートは成果物の lighthouse-production に残る
  lighthouse:
    needs: [build, deploy]
    # Chrome が最初から入っている
    runs-on: ubuntu-latest
    # 9 ページ × 2 端末 × 5 回（1 回 12〜30 秒で 18〜45 分）と、CDN の入れ替わりを待つ時間（最長 20 分）に余裕を持たせる
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pages は HTML を 10 分（Cache-Control: max-age=600）キャッシュするので、公開の直後は前の版が返ることがある。
      # 前の版を測らないよう、公開したページの中身がこの版のビルドと一致するまで待つ
      - name: Wait for the new version to be served
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED: ${{ needs.build.outputs.library-sha256 }}
        run: |
          for i in $(seq 1 40); do
            actual=$(curl -fsS "${PAGE_URL}library" | sha256sum | cut -d " " -f 1 || true)
            if [ "$actual" = "$EXPECTED" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::20 分待っても ${PAGE_URL}library が新しい版になりませんでした"
          exit 1

      - run: pnpm lighthouse:web --url "${{ needs.deploy.outputs.page_url }}" lighthouse-results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-production
          path: lighthouse-results/
          retention-days: 90
