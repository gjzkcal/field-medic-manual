# マニュアルの Web 版を GitHub Pages（https://gjzkcal.github.io/field-medic-manual/）に公開する。
# 配ったアプリと同じ原稿にするため、リリース（release.yml）が Releases への公開に成功してから呼び出す。
# 手で公開し直すときは、Actions の画面で版のタグ（v0.4.0 など）を選んで実行する。
name: Pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# 付け替えられるタグではなくコミットの SHA で外部のアクションを固定し、版はコメントに書く
# （Renovate が ci.yml・release.yml とそろえて SHA とコメントを両方更新する。手で変えるときも同じようにする）
jobs:
  build:
    # 画面のビルドは OS に依らないので、起動の速いランナーにする
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # main など、配っていない原稿を公開しないよう、版のタグからだけ公開する
      - name: Check that a release tag is selected
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        run: |
          echo "::error::Web 版は版のタグ（v0.4.0 など）から公開してください（今は ${GITHUB_REF}）"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:web

      # ディープリンクを開けなくなる・HTTP 404 で返る・Tauri の API がブラウザに入って落ちる、という壊れ方を公開の前に止める
      - name: Check the build output
        run: |
          cmp dist-web/index.html dist-web/404.html
          cmp dist-web/index.html dist-web/library.html
          # 原稿ごとの写しが無いと、本文の URL を直接開いたときに HTTP 404 で返る
          manuals=$(ls content/manuals/*.md | wc -l)
          pages=$(ls dist-web/doc/*.html | wc -l)
          if [ "$manuals" -ne "$pages" ]; then
            echo "::error::原稿は $manuals 本ですが、dist-web/doc の写しは $pages 個です"
            exit 1
          fi
          if grep -rl "__TAURI" dist-web; then
            echo "::error::Web 版のビルドに Tauri の API が入っています"
            exit 1
          fi
          # 原稿はビルドのときに変換して同梱する。無いと、ブラウザで原稿の表を読めない
          if ! ls dist-web/assets/_virtual_web-store-*.js >/dev/null 2>&1; then
            echo "::error::Web 版のビルドに、変換した原稿の表（virtual:web-store）がありません"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages への書き込みと、その認証に使う OIDC のトークンは、公開するこのジョブだけに与える
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # タグの push と手での実行が重なっても、公開の途中で止めない
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
