# Web 版の全ページ（画面と原稿ごと）の A11y・BP・SEO を Lighthouse で測り、100 を切ったら失敗にする（scripts/lighthouse.ts）。
# リリースの前に、main の Web 版に崩れが無いかを確かめるため。原稿によって結果が変わるので、全部を測る。
# Performance はここでは測らない。ランナーの速さでぶれ、利用者が開く本番とも配信が違うので、
# Pages に公開した後に本番を測る（pages.yml）。
# 全ページを 5 つのジョブに分けて同時に測り、待ち時間を縮める。
# 結果の表は分担ごとのジョブの概要に、レポート（HTML・JSON）は分担ごとのフォルダに分けて成果物の lighthouse に残る。
name: Lighthouse

on:
  push:
    branches: [main]
    # Rust だけの変更では Web 版は変わらない（ci.yml の画面側と同じ除外。アイコンは Web 版の favicon に使うので除かない）
    paths-ignore:
      - "src-tauri/src/**/*.rs"
      - "src-tauri/build.rs"
      - "src-tauri/.cargo/**"
      - "src-tauri/rust-toolchain.toml"
      # Web 版のビルドが読まないファイル（CHANGELOG はリリースの本文とテストにだけ使う）
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/renovate.json5"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/lighthouse-compare.yml"
      - "README.md"
      - "CHANGELOG.md"
  # マージの前に崩れに気づくため（main で初めて落ちたことがある）。除外は push と同じものに、
  # 依存だけの PR（Renovate）を足す。依存の更新は週 1 回まとめて来るので、main に入ってから測る
  pull_request:
    paths-ignore:
      - "src-tauri/src/**/*.rs"
      - "src-tauri/build.rs"
      - "src-tauri/.cargo/**"
      - "src-tauri/rust-toolchain.toml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/renovate.json5"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/lighthouse-compare.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "THIRD_PARTY_LICENSES.txt"
  workflow_dispatch:

permissions:
  contents: read

# 続けて push したら、古い回を止めて最新の main（PR は最新のコミット）だけを測る
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

# 外部のアクションはコミットの SHA で固定し、版はコメントに書く（ci.yml と同じ。Renovate がそろえて更新する）
jobs:
  lighthouse:
    # Chrome が最初から入っている
    runs-on: ubuntu-latest
    # 分担ごとの計測（今は 57 ページ × 2 端末 = 114 回の 5 分の 1。1 回 11 秒、1 台で 3 本ずつ並べる）とビルドに余裕を持たせる。原稿が増えると延びる
    timeout-minutes: 20
    strategy:
      # 1 つの分担が落ちても残りを最後まで測り、100 を切ったページを 1 回で全部出す
      fail-fast: false
      matrix:
        # ランナー（4 コア）1 台で 3 本ずつ並べたまま、ジョブの数で時間を割る。
        # 1 台の固定費（checkout〜build 約 50 秒）に対して計測が 2 分を超えていたので 5 つにした。
        # これ以上は、同時に走る CI・audit・CodeQL と合わせて同時実行の上限（20 ジョブ）に近づき、待ち行列で逆に遅くなる
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:web

      - run: pnpm lighthouse:web --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # 失敗したときこそ、どの監査が落ちたかをレポートで見るので、結果に関わらず残す
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-${{ matrix.shard }}
          path: lighthouse-results/
          retention-days: 30

  # 分担ごとの成果物を 1 つにまとめ、レポートを 1 回のダウンロードで見られるようにする
  merge:
    needs: lighthouse
    # 失敗したときこそレポートを見るので、計測の結果に関わらずまとめる
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          pattern: lighthouse-*
          # どの分担も summary.md を出すので、分担ごとのフォルダに分けて上書きを避ける
          separate-directories: true
          delete-merged: true
          retention-days: 30
