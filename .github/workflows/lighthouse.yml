# Web 版の全ページ（画面と原稿ごと）の A11y・BP・SEO を Lighthouse で測り、100 を切ったら失敗にする（scripts/lighthouse.ts）。
# リリースの前に、main の Web 版に崩れが無いかを確かめるため。原稿によって結果が変わるので、全部を測る。
# Performance はここでは測らない。ランナーの速さでぶれ、利用者が開く本番とも配信が違うので、
# Pages に公開した後に本番を測る（pages.yml）。
# 結果の表はジョブの概要に、レポート（HTML・JSON）は成果物の lighthouse に残る。
name: Lighthouse

on:
  push:
    branches: [main]
    # Rust だけの変更では Web 版は変わらない（ci.yml の画面側と同じ除外。アイコンは Web 版の favicon に使うので除かない）
    paths-ignore:
      - "src-tauri/src/**/*.rs"
      - "src-tauri/build.rs"
      - "src-tauri/.cargo/**"
      - "src-tauri/rust-toolchain.toml"
      # Web 版のビルドが読まないファイル（CHANGELOG はリリースの本文とテストにだけ使う）
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/renovate.json5"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/pages.yml"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

# 続けて push したら、古い回を止めて最新の main だけを測る
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

# 外部のアクションはコミットの SHA で固定し、版はコメントに書く（ci.yml と同じ。Renovate がそろえて更新する）
jobs:
  lighthouse:
    # Chrome が最初から入っている
    runs-on: ubuntu-latest
    # 全ページ × 2 端末の計測（今は 84 回。3 本ずつ並べる）とビルドに余裕を持たせる。原稿が増えると延びる
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:web

      - run: pnpm lighthouse:web

      # 失敗したときこそ、どの監査が落ちたかをレポートで見るので、結果に関わらず残す
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: lighthouse-results/
          retention-days: 30
