# タグ（v0.0.1 など）を push すると、確認（ci.yml）を通してから、ビルド・署名をして GitHub Releases に公開する。
# 公開した latest.json を、インストール済みのアプリが起動時に読んで自動で更新する。
# 手順は README の「リリースの手順」を参照。
name: Release

on:
  push:
    tags: ["v*"]

# 同じタグで二重に走らせない（Releases のアセットを取り合わないように）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 壊れた版を配らないよう、普段の push・PR と同じ確認を通す
  check:
    uses: ./.github/workflows/ci.yml
    # 呼び出したワークフローはここで与えた権限までしか持てず、ci.yml の changes ジョブが
    # 宣言する pull-requests: read が無いと起動に失敗する（タグでは PR の API は使わない）
    permissions:
      contents: read
      pull-requests: read

  release:
    needs: check
    runs-on: windows-latest
    # Releases の作成とアセットのアップロードに書き込みの権限が要る
    permissions:
      contents: write
    # 署名鍵と書き込みの権限を持つジョブなので、付け替えられるタグではなくコミットの SHA で
    # 外部のアクションを固定し、版はコメントに書く（更新するときは SHA とコメントを両方変える）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # src-tauri/rust-toolchain.toml の版を入れる。rust-cache がキーに rustc の版を使うので、その前に入れる
      - run: rustup toolchain install
        working-directory: src-tauri

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      # 依存のライセンス表記（THIRD_PARTY_LICENSES.txt）の生成に使う
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-about@0.9.2

      - run: pnpm install --frozen-lockfile

      # 版を上げ忘れたタグや、CHANGELOG に節の無い版を配らないよう、ビルドの前に確かめる
      - name: Check the tag and extract release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.ts "${GITHUB_REF_NAME}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # beforeBuildCommand がライセンス表記の生成と画面のビルドを行う（tauri.conf.json）
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新用の署名鍵。.env では読まれないので環境変数で渡す
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Field Medic Manual ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # README は管理者権限の要らない -setup.exe（NSIS）で案内しているので、自動更新も NSIS にそろえる
          updaterJsonPreferNsis: true
