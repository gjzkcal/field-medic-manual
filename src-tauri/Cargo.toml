[package]
name = "field-medic-manual"
version = "0.5.1"
description = "Unofficial manual app for ACE Medical (Arma Reforger)"
authors = ["gjzkcal"]
license = "GPL-3.0-or-later"
repository = "https://github.com/gjzkcal/field-medic-manual"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "field_medic_manual_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
percent-encoding = "2"
tauri-plugin-process = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 既定の機能の `zip` は、Windows で zip に包んだ更新を展開するためだけのもの。リリースは -setup.exe と .msi をそのまま配るので要らない。
# zip の crate（^4）に直っていない脆弱性があるので外す（RUSTSEC-2026-0367〜0369）
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
